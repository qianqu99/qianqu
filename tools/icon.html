<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width: 1024px;
    height: 1024px;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  .icon {
    position: relative;
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    border-radius: 232px;
    background:
      radial-gradient(560px 460px at 78% 18%, rgba(111, 231, 255, 0.4), transparent 66%),
      radial-gradient(520px 520px at 18% 100%, rgba(141, 141, 255, 0.34), transparent 68%),
      linear-gradient(145deg, #061a30 0%, #0a3c5b 42%, #0f6b83 76%, #58c9d8 100%);
    box-shadow:
      inset 0 0 0 2px rgba(205, 245, 255, 0.24),
      inset 0 -80px 160px rgba(2, 8, 16, 0.3);
  }
  .glow {
    position: absolute;
    width: 640px;
    height: 640px;
    left: 190px;
    top: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 244, 255, 0.26), transparent 64%);
    filter: blur(18px);
  }
  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(207, 247, 255, 0.16);
  }
  .orbit.a {
    width: 720px;
    height: 720px;
    left: 152px;
    top: 152px;
  }
  .orbit.b {
    width: 840px;
    height: 840px;
    left: 92px;
    top: 92px;
    border-style: dashed;
    border-color: rgba(207, 247, 255, 0.11);
  }
  .whale {
    position: absolute;
    left: 176px;
    top: 190px;
    width: 672px;
    height: 672px;
    color: #e8fdff;
    filter: drop-shadow(0 26px 46px rgba(2, 18, 30, 0.42));
  }
  .whale svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.55;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .wave {
    position: absolute;
    left: 208px;
    right: 208px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, rgba(212, 251, 255, 0.8), transparent);
  }
  .wave.a { bottom: 236px; opacity: 0.75; }
  .wave.b { bottom: 206px; opacity: 0.35; transform: scaleX(0.78); }
  .bubble {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(216, 250, 255, 0.35);
  }
  .bubble.a { width: 18px; height: 18px; right: 210px; top: 286px; }
  .bubble.b { width: 11px; height: 11px; right: 184px; top: 336px; opacity: 0.7; }
  .bubble.c { width: 8px; height: 8px; right: 250px; top: 230px; background: rgba(216, 250, 255, 0.55); border: 0; }
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <div class="orbit a"></div>
    <div class="orbit b"></div>
    <div class="wave a"></div>
    <div class="wave b"></div>
    <span class="bubble a"></span>
    <span class="bubble b"></span>
    <span class="bubble c"></span>
    <div class="whale">
      <svg viewBox="0 0 64 64">
        <path d="M10 33c4.6-8.4 13.6-12.6 22.4-10.3 5.4 1.4 9.3 5.2 11 10 .3.8 1.2 1.2 2 .8l4.2-2.2c1-.5 2.1.4 1.7 1.5-2.1 6.2-7.9 10.3-14.4 10.3-2.7 0-5.3-.7-7.5-2"/>
        <path d="M10 33c.6 6.1 5.7 10.9 11.9 10.9 3.8 0 7.2-1.7 9.4-4.5"/>
        <path d="M21 22.8c.5-3.8 2.4-6.3 4.8-7.3"/>
        <circle cx="43.4" cy="29.4" r="1.5" fill="currentColor" stroke="none"/>
        <path d="M31.5 42.5c3.6 2.1 7.5 2.8 11.6 1.9"/>
      </svg>
    </div>
  </div>
</body>
</html>
