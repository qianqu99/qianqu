name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Package Windows portable app
        run: npm run pack
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: qianqu-win32-x64
          path: dist-v200/qianqu-win32-x64
          if-no-files-found: error

      - name: Create portable zip and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "qianqu-$tag-win32-x64.zip"
          Compress-Archive -Path "dist-v200/qianqu-win32-x64" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          "qianqu $tag`n$zip  $hash" | Set-Content -Path SHA256.txt -Encoding utf8
          Get-Content SHA256.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "qianqu-$tag-win32-x64.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip SHA256.txt --clobber
          } else {
            gh release create $tag $zip SHA256.txt --title "qianqu $tag" --generate-notes
          }
